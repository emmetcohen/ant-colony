<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ant Colony</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#1b1410;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:#f3e9d2}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;box-shadow:0 0 0 4px #0d0906;touch-action:none}
#hud{position:absolute;left:12px;top:8px;font-size:12px;opacity:.85;pointer-events:none;text-shadow:0 1px 0 #000,0 0 3px #000}
#hud .warn{color:#ffcf6b}
#hint{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:11px;opacity:.55;pointer-events:none;text-shadow:0 1px 0 #000,0 0 3px #000}
.box{position:absolute;background:rgba(20,14,10,.93);border:2px solid #5a4430;padding:10px 12px;font-size:12px;line-height:1.45;border-radius:4px}
#card{left:12px;bottom:28px;width:260px;display:none}
#stats{right:12px;top:12px;bottom:28px;width:320px;overflow:auto;display:none}
#stats h3{margin:12px 0 4px;font-size:12px;color:#e8c98a;text-transform:uppercase;letter-spacing:.08em}
#stats h3:first-child{margin-top:0}
#stats .row{display:flex;justify-content:space-between;gap:8px}
#stats .row span:last-child{text-align:right}
#stats .need{margin:0 0 6px}
#stats .need b.ok{color:#9fd88a}
#stats .need b.bad{color:#ffb36b}
#stats .need div{opacity:.75;font-size:11px}
#stats .day{margin:0 0 6px;padding-left:8px;border-left:2px solid #5a4430}
#stats .ev{opacity:.8;font-size:11px}
#stats ul{margin:2px 0 0;padding-left:16px}
#stats li{margin-bottom:4px;font-size:11.5px}
#clock{position:absolute;right:14px;top:8px;text-align:right;pointer-events:none;text-shadow:0 1px 0 #000,0 0 4px #000;line-height:1.1}
#clock b{font-size:22px;letter-spacing:.04em}
#clock span{font-size:11px;opacity:.8}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fffaf0;color:#2a1d12;font-size:11px;line-height:1.3;padding:4px 7px;border-radius:8px;max-width:190px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:opacity .6s}
.bub:after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fffaf0}
.bub b{display:block;font-size:9.5px;opacity:.55;font-weight:600}
.bub.ai{background:#eef6ff}.bub.ai:after{border-top-color:#eef6ff}
#toast{left:50%;top:14px;transform:translateX(-50%);display:none;max-width:460px;text-align:center}
#catch{inset:0;border:0;border-radius:0;background:rgba(20,14,10,.9);display:none;align-items:center;justify-content:center;flex-direction:column;font-size:14px;text-align:center}
.bar{width:260px;height:10px;background:#3a2a1c;margin-top:12px;border:1px solid #5a4430}
.bar i{display:block;height:100%;background:#e8c98a;width:0}
.mini{display:inline-block;width:90px;height:7px;background:#3a2a1c;vertical-align:middle;margin-left:6px}
.mini i{display:block;height:100%;background:#e8c98a}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud"></div>
<div id="hint">click: drop food &middot; F: switch sugar / cricket / water &middot; hold: pour &middot; right-click: remove &middot; shift+click: inspect an ant &middot; S: stats &amp; care tips &middot; T: time-lapse &middot; A: AI brains &middot; B: thought bubbles</div>
<div id="card" class="box"></div>
<div id="stats" class="box"></div>
<div id="bubbles"></div>
<div id="clock"></div>
<div id="toast" class="box"></div>
<div id="catch" class="box"></div>
<script>
'use strict';
(function(){
/* ============================ constants ============================ */
// World is 512x288 pixels. One pixel is about 0.4 mm, so a 12-pixel worker is about 4.5 mm long (a black garden ant).
const W=512,H=288,GROUND=52,CW=W/2,CH=H/2,TPS=30,EX=256,CAP=160,INF=30000;
const AIR=0,DIRT=1,SUGAR=2,WALL=3,LOOSE=4,ROCK=5,WATER=6;
const TR=5.5;          // tunnel radius in pixels (about 4.5 mm wide)
const HOLE=8;          // half-width of the nest entrance that loose grains can't fall into
const PPB=1;           // pixels of soil in one pellet an ant carries out (about 0.4 mm)
const MM=0.4;          // mm per pixel
const LARVA_T=72000,EGG_T=28800,PUPA_T=72000; // brood timings (sim seconds)
const SAVE_KEY='antcolony.v3';
const rnd=Math.random,hyp=Math.hypot;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=6.283185;while(d<-Math.PI)d+=6.283185;return d}
function nz(i){return Math.imul(i,2654435761)>>>24}
const NAMES=['Anty','Bea','Cleo','Dot','Eli','Fern','Gus','Hugo','Ivy','Juno','Kip','Lulu','Moe','Nina','Otto','Pip','Quinn','Rue','Sage','Tito','Uma','Vee','Walt','Xia','Yuki','Zed','Maple','Biscuit','Pepper','Waffles','Nugget','Olive','Poppy','Rusty','Sprout','Tango','Ziggy','Mochi','Clover','Bolt'];

/* ============================ world state ============================ */
let grid,gid,copen,walk,ph,gh;
let gx=[],gy=[],gk=[],wake=true,nSugar=0,nWater=0;
let ants=[],brood=[],corpses=[],sites=[],foods=[],queen=null;
let places={};
let stash=0,protStash=0,moisture=.6,tickN=0,terrainVer=1,bioNow=0,t0=Date.now(),nid=1,nameN=0,lastExpand=0,workMul=1;
let logs={},events=[],totals={};
let stim={forage:0,dig:0,nurse:0,clean:0,queen:0};
const speech=[]; // things ants "say": the browser shows them as speech bubbles
function say(a,text,imp){if(!a||!text)return;if(speech.length>30)speech.shift();speech.push({a,text:String(text).slice(0,110),imp:!!imp})}
let brain=null; // AI brain (set up in the browser). When it's busy or off, ants act on instinct (the rules).
const fcache=new Map();
const bq=new Int32Array(CW*CH);

/* ============================ day / log helpers ============================ */
function dayOf(){return Math.floor(bioNow/86400)+1}
function L(){const d=dayOf();return logs[d]||(logs[d]={eggs:0,hatched:0,died:0,grains:0,prot:0,dug:0,lost:0,water:0})}
function startTOD(){const d=new Date(t0);return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()}
function clockStr(bs){const s=(startTOD()+bs)%86400;let h=Math.floor(s/3600),m=Math.floor(s%3600/60);const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+(m<10?'0':'')+m+ap}
function addEvent(text){events.push({t:bioNow,day:dayOf(),text});if(events.length>300)events.shift()}
const once={};function eventOnce(key,text){if(totals['ev_'+key])return;totals['ev_'+key]=1;addEvent(text)}

/* ============================ terrain ============================ */
function rc(x,y){const i=(y>>1)*CW+(x>>1),a=(y&~1)*W+(x&~1),o=copen[i];copen[i]=(grid[a]===0&&grid[a+1]===0&&grid[a+W]===0&&grid[a+W+1]===0)?1:0;if(o!==copen[i])updWalk(x>>1,y>>1)}
// A cell is "walkable" if an ant there would be standing on a floor (solid just below) or clinging to a wall (solid close to its side).
// Ants never hang in mid-air or walk upside down on ceilings.
function cOpen(cx,cy){return cx>=0&&cy>=0&&cx<CW&&cy<CH&&copen[cy*CW+cx]===1}
function calcWalk(cx,cy){
  if(cx<0||cy<0||cx>=CW||cy>=CH)return;const c=cy*CW+cx;
  if(!copen[c]){walk[c]=0;return}
  if(gh&&Math.abs(cx*2+1-EX)<=HOLE&&cy*2+1>=gh[EX]-7&&cy*2+1<=gh[EX]+2){walk[c]=1;return} // ants step straight across the entrance hole
  // solid ground below, beside, or at a corner/edge below (ants grip lips and edges)
  let w=false;
  for(let dy=0;dy<=2&&!w;dy++)for(let dx=-3;dx<=3;dx++){if(dy===0&&dx===0)continue;if(dy===2&&Math.abs(dx)>1)continue;if(!cOpen(cx+dx,cy+dy)){w=true;break}}
  walk[c]=w?1:0;
}
function updWalk(cx,cy){for(let dy=-2;dy<=0;dy++)for(let dx=-3;dx<=3;dx++)calcWalk(cx+dx,cy+dy)}
function refreshCopen(x0,y0,x1,y1){
  const cx0=Math.max(0,x0>>1),cx1=Math.min(CW-1,x1>>1),cy0=Math.max(0,y0>>1),cy1=Math.min(CH-1,y1>>1);
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const a=cy*2*W+cx*2;copen[cy*CW+cx]=(grid[a]===0&&grid[a+1]===0&&grid[a+W]===0&&grid[a+W+1]===0)?1:0}
  for(let cy=cy0-2;cy<=cy1;cy++)for(let cx=cx0-3;cx<=cx1+3;cx++)calcWalk(cx,cy);
}
function newWorld(){
  grid=new Uint8Array(W*H);gid=new Int32Array(W*H).fill(-1);copen=new Uint8Array(CW*CH);walk=new Uint8Array(CW*CH);ph=new Float32Array(CW*CH);gh=new Int16Array(W);
  gx=[];gy=[];gk=[];nSugar=0;nWater=0;wake=true;
  for(let x=0;x<W;x++)gh[x]=GROUND+Math.round(Math.sin(x*.04)*1.6+Math.sin(x*.11)*.9);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(x<3||x>=W-3||y<2||y>=H-3)grid[i]=WALL;else if(y>=gh[x])grid[i]=DIRT}
  for(let k=0;k<30;k++){
    const cx=20+rnd()*(W-40),cy=GROUND+26+rnd()*(H-GROUND-50),r=1.8+rnd()*2.6;
    if(Math.abs(cx-EX)<40&&cy<GROUND+90)continue;
    for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r*(0.75+nz(y*W+x)/512)&&grid[y*W+x]===DIRT)grid[y*W+x]=ROCK}
  }
  refreshCopen(0,0,W-1,H-1);
}
function exposed(i){return grid[i-1]===AIR||grid[i+1]===AIR||grid[i-W]===AIR||grid[i+W]===AIR}

/* ============================ grains (sugar, water, loose dirt) ============================ */
function addGrain(x,y,k){
  if(x<3||x>=W-3||y<2||y>=H-3)return false;
  const i=y*W+x;if(grid[i]!==AIR)return false;
  const id=gx.length;gx.push(x);gy.push(y);gk.push(k);grid[i]=k;gid[i]=id;
  if(k===SUGAR)nSugar++;else if(k===WATER)nWater++;
  wake=true;rc(x,y);return true;
}
function removeGrain(id){
  const x=gx[id],y=gy[id],i=y*W+x;if(gk[id]===SUGAR)nSugar--;else if(gk[id]===WATER)nWater--;
  grid[i]=AIR;gid[i]=-1;rc(x,y);
  const last=gx.length-1;
  if(id!==last){gx[id]=gx[last];gy[id]=gy[last];gk[id]=gk[last];gid[gy[id]*W+gx[id]]=id}
  gx.pop();gy.pop();gk.pop();wake=true;
}
function inFunnel(x,y){const dy=gh[x]-1-y;return y>=gh[x]-45&&Math.abs(x-EX)<=HOLE+Math.max(0,dy)*.9}
function guardHole(x,nx,ny,k){
  // ants keep the entrance clear: loose dirt and sugar pile up around it (a crater) but never over it. Water can run in.
  if(k===WATER||!inFunnel(nx,ny))return false;
  return !inFunnel(x,ny-1)||ny>=gh[nx]-1;
}
function stepGrains(){
  if(!wake)return;let moved=false;const n=gx.length;
  for(let id=0;id<n;id++){
    const x=gx[id],y=gy[id],k=gk[id];if(y>=H-4)continue;
    let nx=x,ny=y;
    if(grid[(y+1)*W+x]===AIR&&!guardHole(x,x,y+1,k)){ny=y+1}
    else{
      const d=rnd()<.5?-1:1;
      if(grid[(y+1)*W+x+d]===AIR&&grid[y*W+x+d]===AIR&&!guardHole(x,x+d,y+1,k)){nx=x+d;ny=y+1}
      else if(grid[(y+1)*W+x-d]===AIR&&grid[y*W+x-d]===AIR&&!guardHole(x,x-d,y+1,k)){nx=x-d;ny=y+1}
      else if(k===WATER&&grid[y*W+x+d]===AIR&&rnd()<.5){nx=x+d}
    }
    // a grain resting over the entrance rolls off to the side, so the mound forms a crater around the hole
    if(nx===x&&ny===y&&k!==WATER&&y<gh[x]&&inFunnel(x,y)){const d=x>=EX?1:-1;if(grid[y*W+x+d]===AIR)nx=x+d;else if(y>=gh[x]-3){removeGrain(id);moved=true;continue}}
    if(nx!==x||ny!==y){
      const i=y*W+x,j=ny*W+nx;grid[j]=grid[i];grid[i]=AIR;gid[j]=id;gid[i]=-1;gx[id]=nx;gy[id]=ny;rc(x,y);rc(nx,ny);moved=true;
    }
  }
  wake=moved||nWater>0;
}
function soakWater(){
  // water soaks into the soil and raises the moisture
  for(let id=gx.length-1;id>=0;id--){
    if(id>=gx.length||gk[id]!==WATER)continue;
    const i=gy[id]*W+gx[id],b=grid[i+W];
    if((b===DIRT||b===LOOSE||b===WALL||b===ROCK)&&rnd()<.04*workMul){removeGrain(id);moisture=Math.min(1,moisture+.0028);L().water++}
  }
}
function nearestSugar(x,y,R){
  let b=-1,bd=R*R;
  for(let i=0;i<gx.length;i++){if(gk[i]!==SUGAR)continue;const dx=gx[i]-x,dy=gy[i]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i}}
  return b<0?null:{x:gx[b],y:gy[b],type:'s'};
}
function nearestProtein(x,y,R){
  let b=null,bd=R*R;
  for(const f of foods){if(f.moldy||f.amt<=0)continue;const dx=f.x-x,dy=f.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=f}}
  return b?{x:b.x,y:b.y,type:'p',ref:b}:null;
}

/* ============================ navigation fields ============================ */
function bfs(seeds,d,m){
  d.fill(INF);let h=0,t=0;
  for(let s=0;s<seeds.length;s++){const c=seeds[s];if(m[c]&&d[c]===INF){d[c]=0;bq[t++]=c}}
  while(h<t){
    const c=bq[h++],dc=d[c]+1,cx=c%CW;
    if(cx>0){const n=c-1;if(m[n]&&d[n]===INF){d[n]=dc;bq[t++]=n}}
    if(cx<CW-1){const n=c+1;if(m[n]&&d[n]===INF){d[n]=dc;bq[t++]=n}}
    if(c>=CW){const n=c-CW;if(m[n]&&d[n]===INF){d[n]=dc;bq[t++]=n}}
    if(c<CW*(CH-1)){const n=c+CW;if(m[n]&&d[n]===INF){d[n]=dc;bq[t++]=n}}
  }
}
// any=true: a backup route through any open space (climbing walls and ceilings), used only when there is no normal walking route
function getField(key,force,any){
  const m=any?copen:walk,ck=any?'o'+key:key;
  let e=fcache.get(ck);
  if(e&&!(force&&e.tick<tickN)&&(e.ver===terrainVer||tickN-e.tick<30))return e.d;
  if(!e){
    if(fcache.size>30){for(const k of fcache.keys()){if(k!=='exit'){fcache.delete(k);break}}}
    e={d:new Int16Array(CW*CH),ver:0,tick:0};fcache.set(ck,e);
  }
  const seeds=[];
  if(key==='exit'){for(let cy=0;cy*2<GROUND;cy++)for(let cx=0;cx<CW;cx++){const c=cy*CW+cx;if(m[c]&&cy*2+1<gh[cx*2]-2)seeds.push(c)}}
  else{
    const kx=key%CW,ky=(key/CW)|0;let best=-1,bd=99;
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const nx=kx+dx,ny=ky+dy;if(nx<0||ny<0||nx>=CW||ny>=CH)continue;const c=ny*CW+nx;if(m[c]){const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=c}}}
    if(best>=0)seeds.push(best);
  }
  bfs(seeds,e.d,m);e.ver=terrainVer;e.tick=tickN;return e.d;
}
function fieldFor(x,y,force,any){return getField(clamp((y|0)>>1,0,CH-1)*CW+clamp((x|0)>>1,0,CW-1),force,any)}
const DT={x:0,y:0,d:0};
function above(a){return a.y<gh[clamp(a.x|0,0,W-1)]-1}
function gTop(x){x=clamp(x|0,3,W-4);let t=2;while(t<H&&grid[t*W+x]===AIR)t++;return t}
function home(){return places.queen||places.camp}
function gPlace(){return places.granary||home()}
function descend(a,f,any){const m=any?copen:walk;
  const cx=clamp((a.x|0)>>1,0,CW-1),cy=clamp((a.y|0)>>1,0,CH-1);
  let bx=-1,by=-1,bd=INF;
  for(let dy=-1;dy<=1;dy++){const ny=cy+dy;if(ny<0||ny>=CH)continue;for(let dx=-1;dx<=1;dx++){const nx=cx+dx;if(nx<0||nx>=CW)continue;
    if(dx&&dy&&!(m[cy*CW+nx]&&m[ny*CW+cx]))continue; // no cutting corners
    const v=f[ny*CW+nx];if(v<bd){bd=v;bx=nx;by=ny}}}
  if(bd>=INF)return null;
  DT.x=bx*2+1;DT.y=by*2+1;DT.d=bd;return DT;
}
function nearestOpen(x,y,minY){
  let bd=1e9,bx=-1,by=-1;
  for(let cy=Math.max(0,(minY||0)>>1);cy<CH;cy++)for(let cx=0;cx<CW;cx++){
    if(!walk[cy*CW+cx])continue;const dx=cx*2+1-x,dy=cy*2+1-y,d=dx*dx+dy*dy;if(d<bd){bd=d;bx=cx*2+1;by=cy*2+1}
  }
  return bx<0?null:{x:bx,y:by,d:Math.sqrt(bd)};
}
function openArea(){let n=0;for(let cy=(GROUND+4)>>1;cy<CH;cy++)for(let cx=0;cx<CW;cx++)if(copen[cy*CW+cx])n++;return n*4}
function deepest(){for(let cy=CH-1;cy>=0;cy--)for(let cx=0;cx<CW;cx++)if(copen[cy*CW+cx]&&cy*2>GROUND)return cy*2;return GROUND}

/* ============================ ant sprites ============================ */
// side view based on the reference: gaster (back), waist, thorax, head with eye and bent antennae
const BODY=["........X..X",".........XX.",".XXX.XXX.XXX","XXXXXXXXXXEX",".XXX.XXX.XX."];
const LEGS=[["....X.X.X...","...X..X..X.."],[".....X.X.X..","....X..X..X."]];
const QBODY=["............X..X",".............XX.","..XXXXX..XXX.XXX",".XXXXXXX.XXXXXEX",".XXXXXXXXXXX.XX.","..XXXXX........."];
const QLEGS=[["........X.X.X...",".......X..X..X.."],[".........X.X.X..","........X..X..X."]];
// 6 orientations: 0 right, 1 left, 2 up (belly right), 3 up (belly left), 4 down (belly left), 5 down (belly right)
function parse(rows){const p=[];for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const c=rows[y][x];if(c==='X')p.push([x,y,0]);else if(c==='E')p.push([x,y,1])}return p}
function orient(p,w,h,f){return p.map(([x,y,t])=>f===0?[x,y,t]:f===1?[w-1-x,y,t]:f===2?[y,w-1-x,t]:f===3?[h-1-y,w-1-x,t]:f===4?[h-1-y,x,t]:[y,x,t])}
function buildSprites(body,legs){
  const out=[];const w=body[0].length,h=body.length+legs[0].length;
  for(let f=0;f<6;f++){out[f]=[];for(let fr=0;fr<2;fr++)out[f][fr]=orient(parse(body.concat(legs[fr])),w,h,f)}
  return {px:out,w,h};
}
const SPR_W=buildSprites(BODY,LEGS),SPR_Q=buildSprites(QBODY,QLEGS);

/* ============================ ants: creation ============================ */
function mkName(){const n=NAMES[nameN%NAMES.length],k=Math.floor(nameN/NAMES.length);nameN++;return k?n+' '+(k+1):n}
function newAnt(x,y,age){
  return {id:nid++,name:mkName(),x,y,h:rnd()*6.283,face:rnd()<.5?0:1,vx:0,vy:0,frame:0,walk:0,age,maxAge:(10+rnd()*8)*86400,energy:.65+rnd()*.35,starve:0,
    state:'idle',timer:30,resting:false,carry:0,load:0,cref:null,site:null,tx:0,ty:0,tgt:null,mem:null,blocked:0,spd:.75+rnd()*.35,role:'newcomer',ftype:'s',lazy:rnd()<.22,wspd:.35,pause:0,
    th:{forage:.2+rnd()*.5,dig:.2+rnd()*.5,nurse:.2+rnd()*.5,clean:.2+rnd()*.5,queen:.2+rnd()*.5}};
}
function randIn(pl,margin){const ang=rnd()*6.283,r=rnd()*Math.max(1,pl.r-margin);return {x:pl.x+Math.cos(ang)*r*1.3,y:pl.y+Math.abs(Math.sin(ang))*r*.4}}
function newColony(){
  newWorld();ants=[];brood=[];corpses=[];sites=[];foods=[];fcache.clear();
  nid=1;nameN=0;stash=10;protStash=2;moisture=.6;tickN=0;bioNow=0;logs={};events=[];
  totals={eggs:0,hatched:0,deaths:0,grains:0,prot:0,dug:0,lost:0};terrainVer=1;lastExpand=0;t0=Date.now();
  // a fresh ant farm: the colony is placed on top of the soil and has to dig its own home
  const cx=EX-100;
  places={queen:null,nursery:null,granary:null,midden:null,camp:{x:cx,y:gTop(cx)-3,r:9}};
  queen=newAnt(cx,gTop(cx)-4,0);Object.assign(queen,{isQueen:true,name:'The Queen',maxAge:1e12,layT:900,mode:'rest',energy:.9,role:'queen',prot:2,visitT:6*3600});
  for(let i=0;i<12;i++){const x=cx+(rnd()-.5)*36;ants.push(newAnt(x,gTop(x)-4,(1+rnd()*7)*86400))}
  const bp=x=>({x,y:gTop(x)-2});
  for(let i=0;i<6;i++){const p=bp(cx+(rnd()-.5)*12);brood.push(mkBrood(p.x,p.y,0,rnd()*20000))}
  for(let i=0;i<3;i++){const p=bp(cx+(rnd()-.5)*12);const b=mkBrood(p.x,p.y,1,rnd()*40000);b.fed=.8;brood.push(b)}
  dropCube(EX-90,GROUND-30);
  dropCricket(EX+110,GROUND-20);
  addEvent('Colony placed in the ant farm: a queen, 12 workers and 9 brood on bare soil.');
}
function mkBrood(x,y,stage,t){return {id:nid++,x,y,stage,t,fed:.5,prot:0,carried:false,claimT:0}}

/* ============================ movement ============================ */
function free(x,y){return x>=3&&x<W-3&&y>=2&&y<H-3&&grid[(y|0)*W+(x|0)]===AIR}
function note(a,dx,dy){
  a.walk+=hyp(dx,dy);if(a.walk>2.5){a.walk=0;a.frame^=1}
  // smooth the direction so the ant doesn't flip back and forth, and keep its belly on the same side when climbing
  a.vx=a.vx*.82+dx*.18;a.vy=a.vy*.82+dy*.18;
  const ax=Math.abs(a.vx),ay=Math.abs(a.vy);if(ax+ay<.12)return;

  if(above(a)&&!free(a.x,a.y+4.5)&&free(a.x-6,a.y)&&free(a.x+6,a.y)){if(a.face>1||ax>.05)a.face=a.vx>=0?0:1;return}
  if(a.face<2){
    if(ay>ax*1.6){const up=a.vy<0,right=a.face===0;a.face=up?(right?2:3):(right?4:5)}
    else if(ax>ay*.8)a.face=a.vx>0?0:1;
  }else{
    if(ax>ay*1.6)a.face=a.vx>0?0:1;
    else{const bellyR=a.face===2||a.face===5;a.face=a.vy<0?(bellyR?2:3):(bellyR?5:4)}

}
function tryMove(a,dx,dy){
  const nx=a.x+dx,ny=a.y+dy;

  if(free(nx,a.y)){a.x=nx;note(a,dx,0);return true}
  if(free(a.x,ny)){a.y=ny;note(a,0,dy);return true}
  a.blocked++;return false;
}
function moveToward(a,tx,ty,sp){
  const dx=tx-a.x,dy=ty-a.y,d=hyp(dx,dy);if(d<.001)return d;
  // a little side-to-side wobble, like a real ant's zig-zag walk
  const m=Math.min(sp,d),w=d>3?(rnd()-.5)*.4*m:0;tryMove(a,dx/d*m-dy/d*w,dy/d*m+dx/d*w);return d;
}
function moveHeading(a,s){if(!tryMove(a,Math.cos(a.h)*s,Math.sin(a.h)*s))a.h+=(rnd()<.5?-1:1)*(.8+rnd()*1.2)}
function fixBlocked(a){
  if(a.blocked>10)tryMove(a,(rnd()-.5)*2.5,(rnd()-.5)*2.5);
  if(a.blocked>60){a.blocked=0;const o=nearestOpen(a.x,a.y,above(a)?0:GROUND);if(o){a.x=o.x;a.y=o.y}}
}
function unstick(a){

  const o=nearestOpen(a.x,a.y,0);if(o){a.x=o.x;a.y=o.y}
}
function anchorFor(x,y){
  for(const k of ['queen','nursery','granary','midden','camp']){const p=places[k];if(p&&hyp(p.x-x,p.y-y)<=Math.min(6,p.r))return p}
  return {x,y};
}
function nav(a,x,y,sp){
  a.goal={x,y};
  const dd=hyp(x-a.x,y-a.y);
  if(above(a)&&Math.abs(a.x-EX)>2.5){
    // on the surface ants walk over the soil and mounds, toward the entrance if the target is underground
    const under=y>gh[clamp(x|0,0,W-1)]+1;
    if(under||Math.abs(x-a.x)>3){surfaceWalk(a,under?EX:x,sp);fixBlocked(a);return dd}
  }else if(above(a)&&y>gh[clamp(x|0,0,W-1)]+1){moveToward(a,EX,a.y+3,sp);fixBlocked(a);return dd}
  if(dd<12){moveToward(a,x,y,sp);fixBlocked(a);return dd}
  const an=anchorFor(x,y);
  let f=fieldFor(an.x,an.y),t=descend(a,f);
  if(!t){f=fieldFor(an.x,an.y,true);t=descend(a,f)}
  if(!t){f=fieldFor(an.x,an.y,false,true);t=descend(a,f,true);if(t)a.cling=4}
  if(t&&t.d>0)moveToward(a,t.x,t.y,sp);else{moveToward(a,x,y,sp);if(!t)a.cling=4}

}
function navExit(a,sp){
  a.goal={x:EX,y:gh[EX]-6,exit:true};
  let f=getField('exit'),t=descend(a,f);
  if(!t){f=getField('exit',true);t=descend(a,f)}
  if(!t){f=getField('exit',false,true);t=descend(a,f,true);a.cling=4}
  if(t)moveToward(a,t.x,t.y,sp);else{moveToward(a,EX,gh[EX]-6,sp);a.cling=4}
  fixBlocked(a);
}
function surfaceWalk(a,tx,sp){
  if(!a.goal||a.goal.x!==tx)a.goal={x:tx,y:a.y,surf:true};
  // walk along the top of the soil, climbing over piles instead of sliding into holes
  const dx=clamp(tx-a.x,-sp,sp);if(Math.abs(dx)<.01)return;
  if(free(a.x+dx,a.y)){a.x+=dx;note(a,dx,0);a.blocked=0;return}
  if(free(a.x+dx,a.y-1)){a.x+=dx;a.y-=1;note(a,dx,-1);a.blocked=0;return}
  if(free(a.x+dx,a.y-2)&&free(a.x,a.y-2)){a.x+=dx;a.y-=2;note(a,dx,-2);a.blocked=0;return}
  if(free(a.x,a.y-1)){a.y-=1;a.blocked++;return}

function supported(a){

  for(const dx of [-6,-5,-4,4,5,6])if(!free(a.x+dx,a.y)||!free(a.x+dx,a.y+3)||!free(a.x+dx,a.y-3))return true;
  return false;
}
function gravity(a){

  // stand on its legs instead of sinking into the soil
  if(a.face<2&&!free(a.x,a.y+3)&&free(a.x,a.y-1)&&free(a.x,a.y-3)){a.y-=1;return}
  if(supported(a))return;
  if(Math.abs(a.x-EX)<=HOLE&&a.y>=gh[EX]-7&&a.y<=gh[EX]+2)return;
  if(free(a.x,a.y+1))a.y+=1;
}
function settle(o){
  // eggs, larvae, pupae and bodies lie on the floor. If something lands on them they get pushed aside, never up into the air.
  if(o.carried)return;
  if(!free(o.x,o.y)){
    let best=null,bd=1e9;
    for(let dy=-10;dy<=10;dy++)for(let dx=-14;dx<=14;dx++){const x=o.x+dx,y=o.y+dy;if(!free(x,y)||!free(x,y-1))continue;const d=dx*dx+dy*dy*2+(dy<0?-dy*8:0);if(d<bd){bd=d;best=[x,y]}}
    if(best){o.x=best[0];o.y=best[1]}else{const n=nearestOpen(o.x,o.y,0);if(n){o.x=n.x;o.y=n.y}}
  }
  if(free(o.x,o.y+1)&&free(o.x,o.y+2))o.y+=1;
}

/* ============================ digging: planned grain by grain ============================ */
function regionClear(cx,cy,r){
  const rx=r*1.5;
  for(let y=Math.floor(cy-r-3);y<=cy+r+3;y+=2)for(let x=Math.floor(cx-rx-3);x<=cx+rx+3;x+=2){
    if(hyp((x-cx)/1.5,y-cy)>r+3)continue;if(x<6||x>=W-6||y<GROUND+12||y>=H-6)return false;const g=grid[y*W+x];if(g!==DIRT&&g!==LOOSE)return false}
  return true;
}
function pickTarget(bx,by,minD,maxD,r,mode){
  for(let k=0;k<150;k++){
    // real nests: chambers branch sideways off a shaft, and new levels go deeper
    let ang=mode==='side'?(rnd()<.5?0:Math.PI)+(rnd()-.5)*.6:mode==='down'?1.571+(rnd()-.5)*1.1:rnd()*6.283;
    if(Math.sin(ang)<-.15)continue;
    const d=minD+rnd()*(maxD-minD),x=bx+Math.cos(ang)*d,y=by+Math.sin(ang)*d;
    if(y<GROUND+r+16)continue;if(regionClear(x,y,r)){const o=nearestOpen(x,y,GROUND+4);if(o&&o.d<=maxD+r+10)return {x:Math.round(x),y:Math.round(y)}}
  }
  return null;
}
function makePath(sx,sy,tx,ty,minY){
  const pts=[];let x=sx,y=sy,g=0;minY=minY===undefined?GROUND+10:minY;
  while(hyp(tx-x,ty-y)>3&&g++<300){const ang=Math.atan2(ty-y,tx-x)+(rnd()-.5)*1.1;x+=Math.cos(ang)*2.5;y+=Math.sin(ang)*2.5;y=Math.max(minY,y);pts.push({x,y})}
  pts.push({x:tx,y:ty});return pts;
}
function buildPlan(path,chamber){
  // the exact soil pixels this dig will remove, in the order the ants will remove them
  const seen=new Set(),plan=[];
  let px=path.length?path[0].x:chamber.x,py=path.length?path[0].y:chamber.y;
  for(const p of path){
    const step=[];
    for(let y=Math.floor(p.y-TR);y<=Math.ceil(p.y+TR);y++)for(let x=Math.floor(p.x-TR);x<=Math.ceil(p.x+TR);x++){
      if(x<4||x>=W-4||y<GROUND-6||y>=H-4)continue;
      if((x-p.x)**2+(y-p.y)**2>TR*TR)continue;
      const i=y*W+x;if(seen.has(i))continue;seen.add(i);step.push([i,hyp(x-px,y-py)]);
    }
    step.sort((a,b)=>a[1]-b[1]);for(const s of step)plan.push(s[0]);
    px=p.x;py=p.y;
  }
  if(chamber){
    const rx=chamber.r*1.5,ry=chamber.r*.8,fl=ry*.55,cells=[];
    for(let y=Math.floor(chamber.y-ry);y<=Math.ceil(chamber.y+fl);y++)for(let x=Math.floor(chamber.x-rx);x<=Math.ceil(chamber.x+rx);x++){
      if(x<4||x>=W-4||y>=H-4)continue;
      const dx=(x-chamber.x)/rx,dy=(y-chamber.y)/ry;if(dx*dx+dy*dy>1)continue;
      const i=y*W+x;if(seen.has(i))continue;seen.add(i);cells.push([i,hyp((x-px)/1.6,y-py)]);
    }
    cells.sort((a,b)=>a[1]-b[1]);for(const c of cells)plan.push(c[0]);
  }
  return plan;
}
function addSite(kind,x,y,r,path,chamber){
  const plan=buildPlan(path,chamber);
  const f=path.length?path[0]:{x,y};
  sites.push({id:nid++,kind,x,y,r,plan,pi:0,face:{x:f.x,y:f.y},workers:0});
}
function planSites(){
  if(sites.length>=2)return;
  let kind=null;const has=k=>sites.some(s=>s.kind===k);
  if(!places.queen){
    if(has('queen'))return;
    // founding: a shaft straight down from the surface, then the first chamber
    // the shaft runs down past the chamber floor and the chamber opens off its side, like a real nest
    const tx=EX+(rnd()<.5?-1:1)*14,ty=GROUND+44,sx=EX,sy=gTop(EX)-2,pts=[];
    for(let y=sy+2,x=sx;y<ty+6;y+=2.5){x+=(rnd()-.5)*1.4;x=clamp(x,EX-2,EX+2);pts.push({x,y})}
    addSite('queen',tx,ty,10,pts,{x:tx,y:ty,r:10});
    return;
  }
  if(!places.nursery&&!has('nursery'))kind='nursery';
  else if(!places.granary&&!has('granary'))kind='granary';
  else if(!places.midden&&!has('midden'))kind='midden';
  else if(bioNow-lastExpand>10*3600&&sites.length===0&&openArea()<42000&&ants.length>=Math.min(40,8+openArea()/900))kind='expand';
  if(!kind)return;
  const q=places.queen;let tgt=null,r=kind==='expand'?(6.5+rnd()*4.5):(8.5+rnd()*3.5);
  if(kind==='nursery')tgt=pickTarget(q.x,q.y,36,52,r,'side');
  else if(kind==='granary')tgt=pickTarget(q.x,q.y+16,30,48,r,'down')||pickTarget(q.x,q.y,36,54,r,'side');
  else if(kind==='midden'){const b=places.granary||q;tgt=pickTarget(b.x,b.y,48,72,r,'side')}
  else{
    let o=null;for(let k=0;k<4;k++){const c=nearestOpen(24+rnd()*(W-48),GROUND+36+rnd()*(H-GROUND-60),GROUND+12);if(c&&(!o||c.y>o.y))o=c}
    if(o)tgt=pickTarget(o.x,o.y,24,46,r,rnd()<.55?'down':'side');
  }
  lastExpand=kind==='expand'?bioNow:lastExpand;
  if(!tgt)return;
  const st=nearestOpen(tgt.x,tgt.y,GROUND+4);if(!st)return;
  addSite(kind,tgt.x,tgt.y,r,makePath(st.x,st.y,tgt.x,tgt.y),r>7.5?{x:tgt.x,y:tgt.y,r}:null);
}
function digPixel(i){
  const g=grid[i];
  if(g===LOOSE){const id=gid[i];if(id>=0)removeGrain(id);else grid[i]=AIR}
  else grid[i]=AIR;
  rc(i%W,(i/W)|0);
}
function biteSite(s){
  // loosen one pellet (a couple of pixels) at the dig face
  const want=Math.max(1,Math.round(PPB*workMul));let got=0,j=s.pi,look=0,last=-1;
  while(got<want&&j<s.plan.length&&look<160){
    const i=s.plan[j],g=grid[i];
    if(g!==DIRT&&g!==LOOSE){if(j===s.pi)s.pi++;j++;continue}
    if(exposed(i)){digPixel(i);got++;last=i;if(j===s.pi)s.pi++}
    j++;look++;
  }
  if(got===0&&s.pi<s.plan.length){const i=s.plan[s.pi++];if(grid[i]===DIRT||grid[i]===LOOSE){digPixel(i);got=1;last=i}}
  if(got){
    terrainVer++;wake=true;totals.dug+=got;L().dug+=got;
    s.face={x:last%W,y:(last/W)|0};
  }
  if(s.pi>=s.plan.length)finishSite(s);

function finishSite(s){
  const i=sites.indexOf(s);if(i>=0)sites.splice(i,1);s.done=true;
  const pl={x:s.x,y:s.y,r:s.r};
  if(s.kind==='queen'){places.queen=pl;addEvent('The first chamber is dug! The queen moved underground.')}
  else if(s.kind==='nursery'){places.nursery=pl;addEvent('The workers finished a nursery chamber.')}
  else if(s.kind==='granary'){places.granary=pl;addEvent('A food storage chamber is ready.')}
  else if(s.kind==='midden'){places.midden=pl;addEvent('A waste chamber (midden) is finished.')}
  else addEvent('A new tunnel and chamber were dug out.');
  fcache.clear();
}

/* ============================ colony needs + task choice ============================ */
function claimed(o){return o.claimT>tickN}
function larvaNeeds(b){return b.stage===1&&!b.carried&&!claimed(b)&&((b.prot<2&&protStash>0)||(b.fed<.7&&stash>0))}
function updateStim(){
  const w=ants.length,need=clamp(1-stash/(6+w*.5),0,1);
  const hungryLarvae=brood.filter(b=>b.stage===1&&b.prot<2).length;
  const pNeed=protStash<2+hungryLarvae;
  const protOut=foods.some(f=>!f.moldy&&f.amt>0);
  stim.forage=(nSugar>0||protOut)?.25+.7*Math.max(need,pNeed&&protOut?.8:0):(need>.3?.14:.05);
  stim.dig=sites.length?.5+.3*Math.min(1,w/30):0;
  const nr=places.nursery||home();let nn=0;
  for(const b of brood){if(b.carried||claimed(b))continue;if(larvaNeeds(b))nn++;else if(hyp(b.x-nr.x,b.y-nr.y)>nr.r*1.3)nn++}
  stim.nurse=clamp(nn/3,0,1)*.9;
  stim.clean=corpses.some(c=>!c.inMidden&&!c.carried&&!claimed(c))?.8:0;
  stim.queen=(queen&&!claimed(queen)&&((queen.energy<.6&&stash>0)||(queen.prot<1.5&&protStash>0)))?.9:0;
}
const TASKS=['forage','dig','nurse','clean','queen'];
/* ============================ AI brains ============================ */
// Every ant can ask the AI what to do next. It only gets what a real ant could sense: its own body,
// smells and pheromones around the nest, and a few memories. The AI picks a job and writes a thought.
const AI_ACTIONS=['forage','explore','dig','nurse','clean','feed_queen','groom_queen','eat','rest'];
function whereIs(a){
  if(above(a))return 'outside on the surface';
  for(const [k,t] of [['queen',"in the queen's chamber"],['nursery','in the nursery with the brood'],['granary','in the food storage chamber'],['midden','in the waste chamber']]){const p=places[k];if(p&&hyp(p.x-a.x,p.y-a.y)<p.r*1.5+6)return t}
  return 'in a tunnel';
}
function antSenses(a){
  const hungryL=brood.filter(b=>b.stage===1&&(b.fed<.7||b.prot<2)).length,waitP=brood.filter(b=>b.stage===1&&b.prot<2).length;
  const s=[];
  s.push('You are '+a.name+', '+(a.age<86400?'a newly hatched':a.age>8*86400?'an old':'a')+' worker ('+(a.age/86400).toFixed(1)+' days old).');
  s.push('Personality: '+(a.lazy?'lazy, you like resting':'hard-working')+'; you are best at '+TASKS.slice().sort((p,q)=>a.th[p]-a.th[q]).slice(0,2).join(' and ')+'.');
  s.push('Your stomach: '+(a.energy<.25?'starving':a.energy<.5?'hungry':a.energy<.8?'fine':'full')+'.');
  s.push('You are '+whereIs(a)+'.');
  const smell=[];
  if(nSugar>0)smell.push('sugar outside');
  if(foods.some(f=>!f.moldy&&f.amt>0))smell.push('a dead insect (protein) outside');
  if(ph[clamp((a.y|0)>>1,0,CH-1)*CW+clamp((a.x|0)>>1,0,CW-1)]>.3)smell.push('a fresh food trail right here');
  if(hungryL)smell.push(hungryL+' hungry larvae begging for food'+(waitP?(protStash>0?' (they need protein, and there is some stored)':' (they need protein but none is stored)'):''));
  if(sites.some(s=>s.workers<4))smell.push('nestmates digging a new '+(sites[0].kind==='expand'?'tunnel':sites[0].kind==='queen'?'first chamber':sites[0].kind)+' and needing help');
  if(corpses.some(c=>!c.inMidden&&!c.carried))smell.push('a dead nestmate');
  if(queen&&(queen.energy<.6||queen.prot<1.5))smell.push('the queen is hungry');
  if(foods.some(f=>f.moldy))smell.push('mold');
  s.push('You smell: '+(smell.length?smell.join('; '):'nothing special')+'.');
  s.push('Food store: '+(stash<5?'almost empty':stash<30?'low':'plenty of')+' sugar, '+(protStash<1?'no':protStash<5?'a little':'plenty of')+' protein. The soil feels '+(moisture<.15?'very dry':moisture<.3?'dry':moisture>.85?'soggy':'nicely damp')+'.');
  if(a.memo&&a.memo.length)s.push('Your memories: '+a.memo.join(' | ')+'.');
  s.push('What do you do next?');
  return s.join('\n');
}
function applyAI(a,p){
  let ok=false;
  switch(p.action){
    case 'eat':if(stash>0){a.state='eat';a.role='hungry';ok=true}break;
    case 'rest':finishTask(a);a.resting=true;a.timer=150+rnd()*400;ok=true;break;
    case 'groom_queen':if(queen&&places.queen&&ants.filter(o=>o.state==='qGroom').length<3){a.state='qGroom';a.timer=0;a.role='attendant';ok=true}break;
    case 'explore':case 'forage':ok=startTask(a,'forage');break;
    case 'feed_queen':ok=startTask(a,'queen');break;
    case 'dig':case 'nurse':case 'clean':ok=startTask(a,p.action);break;
  }
  if(!ok)return false;
  a.aiThought=p.thought;a.aiAt=bioNow;say(a,p.thought,p.important);
  if(p.remember){a.memo=(a.memo||[]).concat(p.remember.slice(0,80)).slice(-4)}
  totals.ai=(totals.ai||0)+1;
  const l=L();l.quotes=l.quotes||[];const q={n:a.name,t:p.thought};
  if(l.quotes.length<4)l.quotes.push(q);else if(rnd()<.08)l.quotes[(rnd()*4)|0]=q;
  return true;
}
function chooseTask(a){
  if(a.energy<.2&&stash>0){a.state='eat';a.role='hungry';return} // too hungry to think
  if(a.aiPlan){const p=a.aiPlan;a.aiPlan=null;if(applyAI(a,p))return}
  if(!a.skipAI&&brain&&brain.ready()&&!a.aiWaiting&&brain.ask(a)){a.state='think';a.timer=0;return}
  a.skipAI=false;totals.instinct=(totals.instinct||0)+1;
  if(a.energy<.42&&stash>0){a.state='eat';a.role='hungry';return}
  // idle ants near the queen often stop to groom her

/* ============================ the queen ============================ */
// A real queen almost never leaves the nest. She is groomed and fed by workers, lays eggs, and now and then
// walks to where the brood is kept. Without protein she lays far fewer eggs.
function queenThought(q){
  if(q.qThought&&bioNow-q.qAt<3600)return q.qThought;
  if(!places.queen)return 'Waiting on the surface while my workers dig us a home.';
  if(q.mode==='lay')return 'Laying an egg.';
  if(q.mode==='visit')return 'Visiting the nursery to check on the brood.';
  if(q.mode==='back')return 'Heading back to my chamber.';
  if(q.prot<.5)return 'I need protein to lay more eggs.';
  if(q.energy<.4)return 'I am hungry...';
  if(ants.some(a=>a.state==='qGroom'&&hyp(a.x-q.x,a.y-q.y)<14))return 'Being groomed by my workers.';
  return q.mode==='walk'?'Stretching my legs around the chamber.':'Resting, antennae twitching.';

function updateQueen(a,dtb){
  a.age+=dtb;a.energy=Math.max(0,a.energy-dtb/518400*drainMul());

  const pq=places.queen;
  if(a.layT<=0&&a.mode!=='lay'){
    if(a.energy>.3&&ants.length+brood.length<CAP){a.mode='lay';a.timer=90}
    else a.layT=1800;
  }
  switch(a.mode){
    case 'lay':
      if(--a.timer<=0){
        layEgg(a);a.prot=Math.max(0,a.prot-.25);
        let int=5400+rnd()*3600;if(stash<4)int*=2;if(a.prot<=0)int*=4;if(moisture<.15)int*=2;
        a.layT=int;a.mode='rest';a.timer=60+rnd()*120;
      }
      if(a.timer%20===0)a.frame^=1;
      break;
    case 'visit':{
      const n=places.nursery;if(!n){a.mode='back';break}
      const d=nav(a,n.x,n.y,.35);
      if(d<6){a.stay-=dtb;if(a.stay<=0)a.mode='back';if(tickN%30===0)a.frame^=1}
      break}
    case 'back':{
      if(!pq){a.mode='rest';break}
      const d=nav(a,pq.x,pq.y,.35);if(d<6){a.mode='rest';a.timer=200}
      break}
    default:{
      if(pq&&hyp(a.x-pq.x,a.y-pq.y)>pq.r+4){nav(a,pq.x,pq.y,.4);break}
      if(pq&&places.nursery&&a.visitT<=0&&brood.length>0){a.mode='visit';a.stay=3600+rnd()*3600;a.visitT=(6+rnd()*6)*3600;break}
      if(a.timer>0){a.timer--;if(a.mode==='walk'){const d=moveToward(a,a.tx,a.ty,.25);if(d<1.5)a.mode='rest'}else if(rnd()<.02)a.frame^=1}

function loseBrood(i,why){
  const b=brood[i];b.gone=true;b.carried=false;brood.splice(i,1);totals.lost++;L().lost++;
  eventOnce('lost_'+why,{dry:'An egg dried out. The soil is too dry: add water.',prot:'Nurses ate a larva that never got protein. Larvae need protein (crickets) to grow.',mold:'Mold from old food killed some brood. Remove old food (right-click).',wet:'Some brood rotted in soggy soil. Let it dry out a bit.'}[why]);
}
function updateBrood(dtb){
  const moldy=foods.some(f=>f.moldy);
  for(let i=brood.length-1;i>=0;i--){
    const b=brood[i];b.t+=dtb;
    settle(b);
    if(b.stage<2){
      if(moisture<.15&&rnd()<dtb/43200*(.15-moisture)/.15*2){loseBrood(i,'dry');continue}
      if(moisture>.92&&rnd()<dtb/172800){loseBrood(i,'wet');continue}
      if(moldy&&rnd()<dtb/345600){loseBrood(i,'mold');continue}
    }
    if(b.stage===0){if(b.t>=EGG_T){b.stage=1;b.t=0}}
    else if(b.stage===1){
      b.fed-=dtb/108000;
      if(b.fed<=0){b.fed=0;b.sT=(b.sT||0)+dtb;if(b.sT>129600){loseBrood(i,'prot');continue}}else b.sT=0;
      if(b.t>LARVA_T*3&&b.prot<2){loseBrood(i,'prot');continue}
      if(b.t>=LARVA_T&&b.fed>=.5&&b.prot>=2){b.stage=2;b.t=0}
    }else if(b.t>=PUPA_T){
      const a=newAnt(b.x,b.y,0);a.role='newborn';ants.push(a);if(rnd()<.6)say(a,'I just hatched! Everything is so big.');b.gone=true;brood.splice(i,1);
      totals.hatched++;L().hatched++;if(totals.hatched===1)addEvent('The first new worker hatched.');
    }
  }
}
function updateFoods(dtb){
  for(const f of foods){
    if(free(f.x,f.y+2)&&free(f.x-2,f.y+2)&&free(f.x+2,f.y+2))f.y+=1;
    f.age+=dtb*(moisture>.8?2:1);
    if(!f.moldy&&f.age>129600){f.moldy=true;eventOnce('mold','A leftover cricket went moldy. Right-click it to remove it.')}
  }
}

/* ============================ tick ============================ */
function tick(dtb){
  tickN++;bioNow+=dtb;workMul=clamp(dtb*TPS,1,600);
  stepGrains();if(nWater>0&&tickN%3===0)soakWater();
  moisture=Math.max(0,moisture-dtb/86400*.22);
  if(tickN%10===0){for(let i=0;i<ph.length;i++){const v=ph[i];if(v>0){ph[i]=v<.002?0:v*.995}}}
  if(tickN%30===0){updateStim();planSites()}
  updateBrood(dtb);updateFoods(dtb);for(const c of corpses)settle(c);
  if(queen)updateQueen(queen,dtb);
  for(let i=ants.length-1;i>=0;i--)updateAnt(ants[i],dtb);
}

/* ============================ player actions ============================ */
function dropCube(cx,cy){const x0=Math.round(cx)-3,y0=Math.round(cy)-3;for(let dy=5;dy>=0;dy--)for(let dx=0;dx<6;dx++){if(gx.length<9000)addGrain(x0+dx,y0+dy,SUGAR)}}
function dropWater(cx,cy){const x0=Math.round(cx)-2,y0=Math.round(cy)-2;for(let dy=4;dy>=0;dy--)for(let dx=0;dx<5;dx++){if(gx.length<9000)addGrain(x0+dx,y0+dy,WATER)}}
function dropCricket(cx,cy){if(foods.length<12)foods.push({id:nid++,x:Math.round(cx),y:Math.round(cy),amt:14,max:14,age:0,moldy:false})}
function pour(cx,cy,k){for(let i=0;i<5;i++){if(gx.length<9000)addGrain(Math.round(cx+(rnd()-.5)*7),Math.round(cy+(rnd()-.5)*5),k)}}
function eraseAt(cx,cy){
  for(let i=gx.length-1;i>=0;i--){if(i>=gx.length)continue;if((gk[i]===SUGAR||gk[i]===WATER)&&hyp(gx[i]-cx,gy[i]-cy)<9)removeGrain(i)}
  for(let i=foods.length-1;i>=0;i--){if(hyp(foods[i].x-cx,foods[i].y-cy)<10){foods[i].gone=true;foods.splice(i,1)}}
}
function allAnts(){return queen?[queen].concat(ants):ants}
function pickAnt(x,y){let b=null,bd=12;for(const a of allAnts()){const d=hyp(a.x-x,a.y-y);if(d<bd){bd=d;b=a}}return b}

/* ============================ save / load ============================ */
function rleEnc(){
  const out=[];let v=-1,n=0;
  for(let i=0;i<grid.length;i++){let g=grid[i];if(g===SUGAR||g===LOOSE||g===WATER)g=AIR;if(g===v)n++;else{if(n)out.push(v,n);v=g;n=1}}
  out.push(v,n);return out;
}
function rleDec(arr){const g=new Uint8Array(W*H);let p=0;for(let i=0;i<arr.length;i+=2){g.fill(arr[i],p,p+arr[i+1]);p+=arr[i+1]}return g}
function packAnt(a){return {id:a.id,name:a.name,x:a.x,y:a.y,age:a.age,maxAge:a.maxAge,energy:a.energy,starve:a.starve,spd:a.spd,th:a.th,face:a.face,role:a.role,layT:a.layT,isQueen:a.isQueen,mem:a.mem,prot:a.prot,visitT:a.visitT,lazy:a.lazy,memo:a.memo,aiThought:a.aiThought,aiAt:a.aiAt,qThought:a.qThought}}
function save(){
  try{
    const o={v:3,t0,bioNow,real:Date.now(),tickN,nid,nameN,stash,protStash,moisture,lastExpand,terrain:rleEnc(),
      grains:gx.map((x,i)=>[x,gy[i],gk[i]]),
      ants:ants.map(packAnt),queen:queen?packAnt(queen):null,
      brood:brood.map(b=>({id:b.id,x:b.x,y:b.y,stage:b.stage,t:b.t,fed:b.fed,prot:b.prot,sT:b.sT||0})),
      corpses:corpses.map(c=>({x:c.x,y:c.y,m:c.inMidden})),
      foods,sites:sites.map(s=>({id:s.id,kind:s.kind,x:s.x,y:s.y,r:s.r,plan:s.plan,pi:s.pi,face:s.face})),
      places,logs,events,totals};
    localStorage.setItem(SAVE_KEY,JSON.stringify(o));
  }catch(e){}
}
function load(){
  let o;try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;o=JSON.parse(s)}catch(e){return false}
  if(!o||o.v!==3)return false;
  try{
    newWorld();grid=rleDec(o.terrain);gid.fill(-1);
    refreshCopen(0,0,W-1,H-1);
    for(const g of o.grains)addGrain(g[0],g[1],g[2]);
    t0=o.t0;bioNow=o.bioNow;tickN=o.tickN||0;stash=o.stash;protStash=o.protStash||0;moisture=o.moisture;lastExpand=o.lastExpand||0;
    places=o.places;logs=o.logs||{};events=o.events||[];totals=o.totals;foods=o.foods||[];
    const mk=p=>Object.assign(newAnt(p.x,p.y,p.age),p,{state:'idle',timer:30,carry:0,load:0,cref:null,site:null,tgt:null,blocked:0,vx:0,vy:0});
    ants=o.ants.map(mk);
    queen=o.queen?Object.assign(mk(o.queen),{isQueen:true,mode:'rest',timer:60,maxAge:1e12}):null;
    nid=o.nid;nameN=o.nameN||0;
    brood=o.brood.map(b=>Object.assign(b,{carried:false,claimT:0}));
    corpses=o.corpses.map(c=>({x:c.x,y:c.y,inMidden:c.m,carried:false,claimT:0}));
    sites=o.sites.map(s=>Object.assign(s,{workers:0}));
    fcache.clear();terrainVer++;
    if(typeof window!=='undefined')window.__lastReal=o.real;
    return true;
  }catch(e){console.error('load failed',e);return false}
}

  for(let i=0;i<list.length;i++){const p=list[i];px((cx|0)+ox+p[0],(cy|0)+oy+p[1],p[2]?eye:body)}

}
function drawBrood(b){
  const x=b.x|0,y=b.y|0;
  if(b.stage===0){const c=rgb(255,252,240);px(x,y,c);px(x+1,y,c);px(x,y+1,c);px(x+1,y+1,c)}
  else if(b.stage===1){const c=b.prot<2?rgb(240,214,160):rgb(252,240,200);for(let j=0;j<3;j++)for(let i=0;i<(j===1?4:3);i++)px(x+i-1-(j===1?0:0),y+j-1,c);if(b.prot>=1)px(x+1,y,rgb(200,150,110))}
  else{const c=rgb(232,214,160),d=rgb(205,185,130);for(let j=0;j<5;j++)for(let i=0;i<(j===0||j===4?2:3);i++)px(x+i-1,y+j-2,i===2?d:c)}
}
const CRICKET=["..X......","XXXXXXXX.","XXXXXXXXX",".X..X..X."];
function drawFood(f){
  const w=9,cut=Math.ceil(w*(1-f.amt/f.max)),x0=(f.x|0)-4,y0=(f.y|0)-3;
  for(let y=0;y<4;y++)for(let x=0;x<w-cut;x++){
    if(CRICKET[y][x]!=='X')continue;const i=(y0+y)*W+x0+x;
    let c=f.moldy?((nz(i+tickN)&3)===0?rgb(235,240,230):rgb(150,160,140)):(x>=w-3?rgb(80,58,30):rgb(132,94,46));
    px(x0+x,y0+y,c);
  }
  if(f.moldy)for(let k=0;k<3;k++)px(x0+((nz(f.id*7+k)%9)),y0-1,rgb(230,235,225));

let skyNow=null;
function skyLight(){ // 0 = night, 1 = full day, from the colony clock
  const h=((startTOD()+bioNow)%86400)/3600;
  if(h>=7&&h<18)return 1;if(h>=21||h<5)return 0;
  return h<7?(h-5)/2:(21-h)/3;
}
function render(sel,mouse,tool){
  if(!skyNow)skyNow=new Uint32Array(H);
  {const L=skyLight();for(let y=0;y<H;y++){const t=clamp(y/GROUND,0,1);
    const dr=148+t*62,dg=202+t*32,db=232+t*12,nr=14+t*30,ng=20+t*30,nb=48+t*40;
    skyNow[y]=rgb(nr+(dr-nr)*L,ng+(dg-ng)*L,nb+(db-nb)*L)}}

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i=y*W+x,g=grid[i];let c;
      if(g===AIR){
        if(y<gh[x])c=skyNow[y];
        else{c=((nz(i)&15)===0)?rgb(206,181,142):TUN;if(grid[i-1]||grid[i+1]||grid[i-W]||grid[i+W])c=TUNE}
      }else if(g===DIRT){
        const t=(y-GROUND)/(H-GROUND),n=nz(i);let r=122-t*34,gg=86-t*24,b=56-t*18;const v=(n>>4)-8;r+=v;gg+=v*.8;b+=v*.6;
        if(n>250){r+=26;gg+=20;b+=14}else if(n<6){r-=26;gg-=20;b-=14}
        c=rgb(r*wet,gg*wet,b*wet)
      }else if(g===SUGAR)c=(nz(i)&1)?rgb(255,252,246):rgb(232,226,255);
      else if(g===WATER)c=(nz(i+(tickN>>3))&3)?rgb(90,150,225):rgb(150,200,245);
      else if(g===LOOSE){const n=nz(i)>>5;c=rgb((158+n*4)*wet,(122+n*3)*wet,(82+n*2)*wet)}
      else if(g===ROCK)c=(nz(i)&1)?rgb(132,132,140):rgb(108,108,118);
      else c=(x+y)%7===0?WALLH:WALLC;
      buf[i]=c;
    }
  }
  if(skyLight()<.4){for(let k=0;k<40;k++){const x=nz(k*97+3)*2%W,y=3+nz(k*31+7)%(GROUND-12);if(y<gh[x]-4&&grid[y*W+x]===AIR&&(nz(k+(tickN>>6))&7))px(x,y,rgb(230,230,200))}}

    const pile=(n,ox,c1,c2)=>{for(let k=0;k<n;k++){const row=Math.floor(k/9),col=k%9-4+(row%2?.5:0);if(Math.abs(col)<4.6-row*.4)px(Math.round(gp.x+ox+col),yy-row,(k&1)?c1:c2)}};

    for(const [dx,dy] of [[-w-2,-h-2],[w+2,-h-2],[-w-2,h+2],[w+2,h+2]]){px(x+dx,y+dy,c);px(x+dx+(dx<0?1:-1),y+dy,c);px(x+dx,y+dy+(dy<0?1:-1),c)}}
  if(mouse&&mouse.in&&!mouse.shift){
    const c=tool==='water'?rgb(120,180,255):tool==='cricket'?rgb(200,150,90):rgb(255,255,255),x0=Math.round(mouse.x)-3,y0=Math.round(mouse.y)-3;
    for(let i=0;i<6;i+=2){px(x0+i,y0,c);px(x0+i,y0+5,c);px(x0,y0+i,c);px(x0+5,y0+i,c)}

function drawRoute(a){
  // follow the ant's own navigation map to show the way it will walk, then mark where it's going
  const g=a.goal,dot=rgb(255,226,90),end=rgb(255,120,60);

  if(g.exit)f=getField('exit');else if(!g.surf&&hyp(g.x-a.x,g.y-a.y)>=12){const an=anchorFor(g.x,g.y);f=fieldFor(an.x,an.y)}
  let cx=clamp((a.x|0)>>1,0,CW-1),cy=clamp((a.y|0)>>1,0,CH-1),ok=false;
  if(f){
    for(let k=0;k<500;k++){
      let bx=cx,by=cy,bd=f[cy*CW+cx];
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=CW||ny>=CH)continue;const v=f[ny*CW+nx];if(v<bd){bd=v;bx=nx;by=ny}}
      if(bx===cx&&by===cy){ok=bd<INF;break}
      cx=bx;cy=by;if(k%2===0)px(cx*2+1,cy*2+1,dot);
    }
  }
  if(!ok){const d=hyp(g.x-a.x,g.y-a.y),n=Math.min(80,d/3|0);for(let k=1;k<n;k++)px((a.x+(g.x-a.x)*k/n)|0,(a.y+(g.y-a.y)*k/n)|0,dot)}
  const x=g.x|0,y=g.y|0;for(let k=-2;k<=2;k++){px(x+k,y+k,end);px(x+k,y-k,end)}
}
function goalLabel(a){
  if(!a.goal)return '';

  if(a.goal.exit)return 'outside';
  if(s==='fSearch')return a.tgt?(a.tgt.type==='p'?'the dead insect':'the sugar'):'searching around';
  if(s==='fReturn'||s==='eat'||s==='nFeed1'||s==='qFetch'||s==='fHome')return places.granary?'the food storage room':'the food pile';
  if(s==='nFeed2'||s==='nMove')return 'a young one in the brood pile';
  if(s==='nDrop')return 'the nursery';
  if(s==='dGo'||s==='dBite')return 'the dig site';
  if(s==='dOut')return 'outside, with a soil pellet';
  if(s==='dDump')return 'the dirt pile by the entrance';
  if(s==='cFetch')return 'a dead nestmate';
  if(s==='cCarry')return places.midden?'the waste room':'the trash corner outside';
  if(s==='qFeed'||s==='qGroom')return 'the queen';
  if(a.isQueen)return a.mode==='visit'?'the nursery':"her chamber";
  return 'wandering';
}
function drawAnt(a,isQ){
  const S=isQ?SPR_Q:SPR_W;

  const d=drawSprite(S,a.face,a.frame,a.x,a.y,body,rgb(235,235,235));
  if(a.carry&&a.carry!==3){
    const x=a.x|0,y=a.y|0,hw=d.w>>1,hh=d.h>>1;let ix,iy;
    if(a.face===0){ix=x+hw+1;iy=y}else if(a.face===1){ix=x-hw-2;iy=y}else if(a.face<4){ix=x-1;iy=y-hh-2}else{ix=x-1;iy=y+hh+1}
    const c=a.carry===1?rgb(255,252,246):a.carry===2?rgb(150,112,74):a.carry===5?rgb(132,94,46):rgb(70,66,62);
    px(ix,iy,c);px(ix+1,iy,c);px(ix,iy+1,c);px(ix+1,iy+1,c);
  }
}

function dur(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+'d '+h+'h':h?h+'h '+m+'m':m+'m'}

function needs(){

function statsHTML(){
